# Field-name patterns for the sensitive_data scanner (UNVAR-100).
#
# A pattern is one or more words. A field name is split into words at underscores, hyphens,
# digits and camelCase humps ("dateOfBirth" -> date, of, birth) and matches a pattern when the
# pattern's words appear in it in order and next to each other, or joined as one word
# ("firstname" matches "first name"). The last word may also carry a plural "s" or "es".
#
# Override in engagement.yaml under scanners.sensitive_data.patterns: a mapping merges into
# this one key by key, and a list replaces the list it names. To add a class, give a new key
# under classes with a label and terms; to turn one off, give it `terms: []`.
# `unvarnish scanners list` shows the set in effect.

# Names never classified, wherever these words appear in them.
ignore:
  - user agent
  - health check
  - email template
  - minor version
  - address family

# A name whose last word is one of these describes data; it does not hold it.
ignore_suffixes:
  - template
  - check
  - checker
  - regex
  - pattern
  - validator
  - format
  - formatter
  - enabled
  - disabled
  - label
  - placeholder
  - provider
  - service
  - config
  - settings

classes:
  identity:
    label: Identity
    terms:
      - first name
      - last name
      - full name
      - given name
      - family name
      - middle name
