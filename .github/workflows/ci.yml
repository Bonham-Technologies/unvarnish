name: ci
on:
  push:
    branches: [main]
  pull_request:
# Least privilege: every job only reads the repository. A job that needs more asks for it.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes about 6 minutes and a slow apt mirror once made it 32; GitHub's
    # default of six hours would let a hung download hold the runner (UNVAR-65).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing after checkout pushes or fetches, so the token need not stay in .git/config
          # where every later step, the tests included, could read it (UNVAR-70).
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --all-groups
      # Tree-sitter grammars download from GitHub releases at first use (UNVAR-45): fetch them
      # once, with retries, so a release-asset outage fails here and not in unrelated tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('uv.lock', 'src/unvarnish/analysis/languages.py', 'src/unvarnish/analysis/treesitter.py') }}
          restore-keys: tree-sitter-${{ runner.os }}-
      - run: uv run unvarnish grammars fetch --attempts 5
      - run: uv run ruff check .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc graphviz weasyprint
      # The image's weasyprint (docker/weasyprint.txt, hash-locked) first on PATH, so the tagged
      # PDF test runs here as in the image (UNVAR-22); apt's package brings its libraries.
      - run: |
          uv venv --python 3.13 "$RUNNER_TEMP/weasyprint"
          uv pip install --python "$RUNNER_TEMP/weasyprint" --require-hashes -r docker/weasyprint.txt
          echo "$RUNNER_TEMP/weasyprint/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/weasyprint/bin/weasyprint" --version
      - run: uv run pytest -q
      - run: uv build

  # The distributable image, built and run on a fixture (UNVAR-80). Dependabot moves the four
  # digest-pinned images in the Dockerfile, and the text checks in test_distribution.py cannot
  # tell whether the result still builds or runs. It builds on every push to main, and on a pull
  # request only when the image's inputs change; otherwise its steps skip and the job passes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is the base branch,
          # so `git diff HEAD^1 HEAD` lists exactly the files the pull request changes.
          fetch-depth: 2
      - name: Does this change touch the image?
        id: image
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock|README\.md|LICENSE|NOTICE|\.github/workflows/ci\.yml)$|^docker/|^tests/data/docker-smoke/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the image
        if: steps.image.outputs.build == 'true'
        run: docker build --progress plain -t unvarnish:ci .
      - name: Run the image on a fixture with no network
        if: steps.image.outputs.build == 'true'
        run: |
          set -eu
          E="$RUNNER_TEMP/engagement"
          mkdir -p "$E"
          cp -r tests/data/docker-smoke "$E/fixture"
          # As the site kit runs it: the caller's uid, the engagement mounted, no network.
          u() { docker run --rm --network none --user "$(id -u):$(id -g)" -v "$E:/engagement" unvarnish:ci "$@"; }
          u --version
          u init /engagement --client "CI" --consultant "CI"
          u add smoke --files /engagement/fixture
          u run
          u export --format html --doc findings
          ls -l "$E/tools/smoke/docs/findings.md" "$E"/exports/findings-smoke-*.html
          grep -q "<main>" "$E"/exports/findings-smoke-*.html
          # A missing or broken scanner is a note, not a failed run, so check the bundled
          # tools and the scan's notes directly: these are what Dependabot bumps.
          docker run --rm --network none --entrypoint gitleaks unvarnish:ci version
          docker run --rm --network none --entrypoint osv-scanner unvarnish:ci --version
          jq -e '.data.skipped == [] and ([.data.notes[] | select(test("not installed|no end-of-life data bundle"))] | length == 0)' \
            "$E/tools/smoke/inventory/scanner-findings.json"

  # Aggregate job: the single required check. List EVERY other job in `needs`.
  # A skipped job is allowed (some jobs run on pull requests only); a failed
  # or cancelled one fails the gate.
  ci-status:
    # The runner RUNS_ON names (self-hosted today) serves only pull requests from branches of
    # this repo; a fork's pull request, a push and any other event use a hosted runner (UNVAR-70).
    runs-on: ${{ vars.RUNS_ON && github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.RUNS_ON) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    needs: [test, docker]  # every other job, no exceptions
    if: always()
    concurrency:
      group: ci-status-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check CI status
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
