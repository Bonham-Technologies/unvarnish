name: release
# A tag v<version> publishes the wheel and sdist as a GitHub release (UNVAR-124), with the
# repository SBOM, SHA256SUMS over every asset and a build provenance attestation for each
# (bonham-ops checklist SC-2, SC-3, SC-4). The notes are the version's CHANGELOG.md section.
#
# Two jobs, as in Corelata's release: `build` gates the tag and builds with a read-only token,
# and hands the files to `publish`, the only job that can write, which runs none of the
# repository's code.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read # the tagged commit's ci-status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # the gate reads origin/main
          persist-credentials: false
      # The tag must name the package version and a commit on main whose ci-status passed, so a
      # release is only ever cut from code the full test suite ran on. Tagged before main's CI
      # finished: re-run this workflow once it passes.
      - name: the tag names the package version, on a main commit whose ci-status passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          pkg=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)
          [ "$v" = "$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-status" \
            --jq '[.check_runs[].conclusion] | if index("success") then "success" else (first // "missing") end')
          [ "$ci" = success ] \
            || { echo "::error::ci-status on $GITHUB_SHA is $ci; re-run this workflow once main's CI passes"; exit 1; }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv python install 3.13
      - name: build the wheel and sdist
        run: uv build --out-dir release
      - name: release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '
            /^## / { if (on) exit; h = $0; sub(/^## \[?/, "", h); sub(/[] ].*$/, "", h)
                     if (h == v) { on = 1; next } }
            on' CHANGELOG.md >release/notes.md
          grep -q '[^[:space:]]' release/notes.md \
            || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: checksums for the hand-off
        run: cd release && sha256sum -- *.whl *.tar.gz >SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release; read the dependency graph's SBOM
      actions: read # download the build job's files
      id-token: write # sign the provenance attestations
      attestations: write # store them
    steps:
      # No checkout: this job runs no code from the repository, only gh and the attest action.
      - name: the build job's files, the SBOM and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh run download "$GITHUB_RUN_ID" --name release --dir release
          # the files arrived as the build job wrote them (gh does not check the artifact digest)
          (cd release && sha256sum -c SHA256SUMS)
          # The dependency graph describes the default branch, which the gate put this tag on.
          gh api "repos/$GH_REPO/dependency-graph/sbom" --jq .sbom >"release/unvarnish-$v.spdx.json"
          (cd release && sha256sum -- *.whl *.tar.gz *.spdx.json >SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.spdx.json
            release/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" release/*.whl release/*.tar.gz release/*.spdx.json \
            release/SHA256SUMS --verify-tag --title "Unvarnish $v" --notes-file release/notes.md
