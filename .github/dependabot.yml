# Unvarnish uses uv (pyproject.toml + uv.lock), one Dockerfile, and GitHub Actions.
# Matching labels (dependencies, github_actions, javascript, python, docker)
# are created by apply-settings.sh.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies", "python"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # pyproject.toml excludes tree-sitter 0.26.0 because it segfaults freeing large parse trees
    # (docs/decisions.md, slice 1). Without this the group proposed it every week and CI
    # crashed (#75, #82). Only 0.26.0 is ignored; 0.26.1 passed CI and is allowed (#121).
    ignore:
      - dependency-name: "tree-sitter"
        versions: ["0.26.0"]

  # Container base images. Minor and patch bumps come as PRs; a new Python or Node line is a
  # deliberate decision the project makes itself, so Dependabot does not open it. For the
  # `python` image a new line (3.13 to 3.14) is a semver minor, so it is ignored too: CI,
  # `requires-python` and the image move together in one change (UNVAR-27).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    labels: ["dependencies", "docker"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels: ["dependencies", "github_actions"]
    groups:
      actions:
        patterns:
          - "*"
